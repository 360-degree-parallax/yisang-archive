<html lang="ko">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<body>
<title>李箱 作品目錄</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans+KR:wght@400;600&family=Nanum+Myeongjo:wght@700;800&display=swap">
<style>
/* Layout: 파란 도면 위에 흰 격자선. 작품 하나 = 흰 사각 픽셀 하나. 목록 → 원문 상세는 같은 페이지 안에서 #w번호 로 이동. */
:root{
  --blue:#2236D6;
  --white:#FFFFFF;
  --line:rgba(255,255,255,.55);
  --f-serif:"Nanum Myeongjo","Batang","AppleMyungjo",serif;
  --f-sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--blue);color:var(--white)}
body{font-family:var(--f-sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--white)}
a:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--white);outline-offset:3px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.grid{border-left:1px solid var(--line);border-right:1px solid var(--line)}
.row{border-bottom:1px solid var(--line)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.it{font-family:var(--f-mono);font-style:italic}

/* 상단 */
.top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-bottom:1px solid var(--line)}
.top > div{padding-block:40px;padding-inline:24px;border-right:1px solid var(--line);min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.top > div:last-child{border-right:0}
.top h1{margin:0;font-family:var(--f-serif);font-weight:800;font-size:clamp(56px,9vw,128px);line-height:1;letter-spacing:-2px}
.top .sub{margin:16px 0 0;font-size:14px;max-width:420px}
.vert{writing-mode:vertical-rl;font-size:13px;letter-spacing:.04em;white-space:nowrap}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:11px}
.stats span{display:inline-flex;align-items:center;gap:8px}
.sq{display:inline-block;width:10px;height:10px;flex:0 0 auto}
.sq.ws{background:var(--white)}
.sq.nm{border:1.5px solid var(--white)}
.sq.no{width:4px;height:4px;background:var(--white);margin:3px}
.sq.mine{background:var(--white);box-shadow:0 0 0 2px var(--blue),0 0 0 3.5px var(--white)}

.field{display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start}
.field a{display:flex;align-items:center;justify-content:center;width:14px;height:14px;text-decoration:none}
.field a:hover .sq,.field a:focus-visible .sq{transform:scale(1.6)}
.field .gap{flex-basis:100%;height:8px}
.field .lab{flex-basis:100%;font-size:11px;margin-top:4px}

/* 필터 */
.bar{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.bar .grp{display:flex;flex-wrap:wrap;border-right:1px solid var(--line)}
.bar button{min-height:44px;padding:0 14px;font-size:13px;font-weight:600;border-right:1px solid var(--line)}
.bar .grp button:last-child{border-right:0}
.bar button[aria-pressed="true"]{background:var(--white);color:var(--blue)}
.bar .count{margin-left:auto;display:flex;align-items:center;padding:0 16px;font-size:12px}

/* 목록 */
.sec h2{margin:0;padding:56px 24px 16px;font-family:var(--f-serif);font-weight:800;font-size:15px;display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line)}
.sec h2 small{font-family:var(--f-mono);font-weight:400;font-size:11px}
.item{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px;align-items:baseline;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.22);min-height:52px}
.item > *{padding:14px 24px;min-width:0}
.item .no{display:none}
.item .t{font-family:var(--f-serif);font-weight:700;font-size:18px;line-height:1.35}
.item .t em{font-style:normal;font-size:13px;margin-left:8px;opacity:.75}
.item .c{font-family:var(--f-mono);font-size:12px;line-height:1.5}
.item .s{align-self:center}
.item .s{display:flex;justify-content:center}
.item:hover,.item:focus-visible{background:var(--white);color:var(--blue)}
.item:hover .sq.ws,.item:focus-visible .sq.ws,.item:hover .sq.no,.item:focus-visible .sq.no,.item:hover .sq.mine,.item:focus-visible .sq.mine{background:var(--blue)}
.item:hover .sq.nm,.item:focus-visible .sq.nm{border-color:var(--blue)}
.empty{padding:40px 20px;font-size:14px}

/* 상세 */
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);border-bottom:1px solid var(--line)}
.detail > div{padding:28px 20px;min-width:0}
.detail > div:first-child{border-right:1px solid var(--line)}
.back{display:inline-flex;align-items:center;min-height:44px;font-size:13px;font-weight:600;text-decoration:none;border:1px solid var(--white);padding:0 14px}
.back:hover{background:var(--white);color:var(--blue)}
.dt{margin:0;font-family:var(--f-serif);font-weight:800;font-size:clamp(34px,5vw,64px);line-height:1.1;text-wrap:balance}
.dorig{margin:8px 0 0;font-family:var(--f-serif);font-weight:700;font-size:18px}
.meta{display:grid;grid-template-columns:72px minmax(0,1fr);margin:28px 0 0;border-top:1px solid var(--line)}
.meta dt,.meta dd{margin:0;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.meta dt{font-family:var(--f-mono);font-size:12px}
.links{display:flex;flex-direction:column;gap:8px;margin-top:24px}
.links a{display:flex;justify-content:space-between;align-items:center;min-height:48px;padding:0 16px;border:1px solid var(--white);text-decoration:none;font-weight:600;font-size:14px}
.links a:hover{background:var(--white);color:var(--blue)}
.state{display:inline-flex;align-items:center;gap:10px;margin-top:20px;font-size:13px;font-weight:600}
.texthead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.texthead label{font-family:var(--f-serif);font-weight:800;font-size:22px}
textarea{width:100%;min-height:62vh;box-sizing:border-box;background:transparent;color:var(--white);border:1px solid var(--white);padding:18px;font-family:var(--f-serif);font-weight:700;font-size:18px;line-height:1.9;resize:vertical;word-break:keep-all;overflow-wrap:anywhere}
textarea::placeholder{color:rgba(255,255,255,.7)}
.note{margin:10px 0 0;font-size:12px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tools button{min-height:44px;padding:0 16px;border:1px solid var(--white);font-size:13px;font-weight:600}
.tools button:hover{background:var(--white);color:var(--blue)}

.col2{padding:0!important}
.body{padding:28px 24px 64px;min-width:0;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;font-family:var(--f-serif);font-weight:700;font-size:19px;line-height:2}
.body.empty-body{font-family:var(--f-mono);font-weight:400;font-size:12px;line-height:1.6;opacity:.8}
.source-figures{padding:0 24px 40px}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:20px;font-size:12px}

@media (max-width:820px){
  .top{grid-template-columns:minmax(0,1fr)}
  .top > div{border-right:0;border-bottom:1px solid var(--line)}
  .top > div:last-child{display:none}
  .item{grid-template-columns:minmax(0,1fr) 40px}
  .item .c{grid-column:1 / 2;padding-top:0}
  .item .s{grid-row:1 / 3;grid-column:2}
  .item > *{padding-inline:16px}
  .detail{grid-template-columns:minmax(0,1fr)}
  .detail > div:first-child{border-right:0;border-bottom:1px solid var(--line)}
  .bar .count{margin-left:0;width:100%;padding:10px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const hasMine = w => Object.prototype.hasOwnProperty.call(mine, w.id);
const textFor = w => hasMine(w) ? mine[w.id] : (collected[w.id]?.text || '');
function saveMine() { try { localStorage.setItem(KEY, JSON.stringify(mine)); } catch (e) {} }

function status(w) {
  if (textFor(w).trim()) return 'mine';
  if (w.ws || w.gongu) return 'ws';
  if (w.nm) return 'nm';
  return 'no';
}
const STATUS_LABEL = { mine: '본문 수록됨', ws: '원문 링크 있음', nm: '나무위키 문서만 있음', no: '원문 링크 없음' };
const wsUrl = w => collected[w.id]?.source || (w.wsExact
  ? 'https://ko.wikisource.org/wiki/' + encodeURIComponent(w.wsTitle.replace(/ /g, '_'))
  : 'https://ko.wikisource.org/w/index.php?search=' + encodeURIComponent(w.wsTitle || w.title) + '&go=%EB%B3%B4%EA%B8%B0');
const wsFind = w => 'https://ko.wikisource.org/w/index.php?search=' + encodeURIComponent(w.title + ' 이상');
const ggUrl = w => 'https://gongu.copyright.or.kr/gongu/wrt/wrt/view.do?wrtSn=' + w.gongu + '&menuNo=200019';
const nmUrl = w => 'https://namu.wiki/w/' + encodeURIComponent(w.nm);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

/* 상태 */
let filter = 'all', langF = 'all';
const app = document.getElementById('app');

function counts() {
  const c = { mine: 0, ws: 0, nm: 0, no: 0 };
  WORKS.forEach(w => c[status(w)]++);
  return c;
}
function content(w) {
  return [w.year, w.venue, w.note, w.lang === '일' ? '일문' : '국문'].filter(x => x && x !== '—').join(' · ');
}

function renderList() {
  const c = counts();
  const shown = WORKS.filter(w => (filter === 'all' || status(w) === filter) && (langF === 'all' || w.lang === langF));
  let field = '';
  Object.keys(RAW).forEach((sec, i) => {
    field += (i ? '<span class="gap"></span>' : '') + '<span class="lab it">' + sec + '</span>';
    WORKS.filter(w => w.sec === sec).forEach(w => {
      field += '<a href="#' + w.id + '" aria-label="' + esc(w.title) + ' · ' + STATUS_LABEL[status(w)] + '" title="' + esc(w.title) + '"><span class="sq ' + status(w) + '"></span></a>';
    });
  });
  let html = (loadError ? '<p role="alert">전문 데이터를 불러오지 못했습니다. 새로고침해 주세요.</p>' : '') + '<header class="top">'
    + '<div><h1>李箱</h1>'
    + '<div class="stats mono">'
    + '<span><i class="sq ws"></i>본문 미수록 · 링크 ' + c.ws + '</span>'
    + '<span><i class="sq nm"></i>나무위키 문서 ' + c.nm + '</span>'
    + '<span><i class="sq no"></i>링크 없음 ' + c.no + '</span>'
    + (c.mine ? '<span><i class="sq mine"></i>본문 수록 ' + c.mine + '</span>' : '')
    + '</div></div>'
    + '<div><div class="field" aria-label="작품 전체 지도">' + field + '</div></div>'
    + '</header>';
  const fb = (val, label, cur) => '<button type="button" data-f="' + val + '" aria-pressed="' + (cur === val) + '">' + label + '</button>';
  const lb = (val, label) => '<button type="button" data-l="' + val + '" aria-pressed="' + (langF === val) + '">' + label + '</button>';

  Object.keys(RAW).forEach(sec => {
    const list = shown.filter(w => w.sec === sec);
    if (!list.length) return;
    html += '<section class="sec"><h2>' + sec + '<small>' + SEC_KO[sec] + ' · ' + list.length + '편</small></h2>';
    list.forEach(w => {
      html += '<a class="item" href="#' + w.id + '">'
        + '<span class="no mono">' + String(w.no).padStart(3, '0') + '</span>'
        + '<span class="t">' + esc(w.title) + (w.orig ? '<em>' + esc(w.orig) + '</em>' : '') + '</span>'
        + '<span class="c">' + esc(content(w)) + '</span>'
        + '<span class="s" title="' + STATUS_LABEL[status(w)] + '"><i class="sq ' + status(w) + '"></i></span></a>';
    });
    html += '</section>';
  });
  if (!shown.length) html += '<p class="empty">이조건에맞는글이없소.</p>';
  html += footer();
  app.innerHTML = html;
}

function footer() {
  return '<footer class="mono"><span>목록 출처 · <a href="' + SOURCE_URL + '" target="_blank" rel="noopener">나무위키 「이상(작가)/작품 목록」</a> · 2026.10.25 열람</span>'
    + '<span class="it">' + WORKS.length + '編 · 1930—2000 發表</span></footer>';
}

function renderDetail(w) {
  const st = status(w), entry = collected[w.id];
  let links = '';
  const via = w.parent ? ' · 「' + esc(w.parent) + '」 안에 수록' : '';
  if (entry || w.ws) links += '<a href="' + wsUrl(w) + '" target="_blank" rel="noopener">위키문헌 본문' + via + '<span aria-hidden="true">↗</span></a>';
  if (w.gongu) links += '<a href="' + ggUrl(w) + '" target="_blank" rel="noopener">공유마당 본문' + via + '<span aria-hidden="true">↗</span></a>';
  if (w.nm) links += '<a href="' + nmUrl(w) + '" target="_blank" rel="noopener">나무위키 문서<span aria-hidden="true">↗</span></a>';
  if (!w.ws && !w.gongu) links += '<a href="' + wsFind(w) + '" target="_blank" rel="noopener">위키문헌에서 찾아보기<span aria-hidden="true">↗</span></a>';
  const idx = WORKS.indexOf(w), prev = WORKS[idx - 1], next = WORKS[idx + 1];
  app.innerHTML = '<div class="detail">'
    + '<div>'
    + '<h1 class="dt">' + esc(w.title) + '</h1>' + (w.orig ? '<p class="dorig">' + esc(w.orig) + '</p>' : '')
    + '<dl class="meta">'
    + '<dt>分類</dt><dd>' + w.sec + ' · ' + SEC_KO[w.sec] + '</dd>'
    + '<dt>年度</dt><dd>' + esc(w.year) + '</dd>'
    + '<dt>誌面</dt><dd>' + esc(w.venue) + '</dd>'
    + '<dt>言語</dt><dd>' + (w.lang === '일' ? '일문' : '국문') + '</dd>'
    + (w.note ? '<dt>備考</dt><dd>' + esc(w.note) + '</dd>' : '')
    + '<dt>番號</dt><dd class="mono">' + String(w.no).padStart(3, '0') + ' / ' + WORKS.length + '</dd>'
    + '</dl>'
    + '<div class="links">' + links + '</div>'
    + '<div class="tools">'
    + (prev ? '<a class="back" href="#' + prev.id + '">← ' + esc(prev.title) + '</a>' : '')
    + (next ? '<a class="back" href="#' + next.id + '">' + esc(next.title) + ' →</a>' : '')
    + '</div></div>'
    + '<div class="col2"><div class="body" id="body-' + w.id + '"></div>'
    + (entry?.figures?.length ? '<div class="source-figures">' + entry.figures.map(f => '<figure><img style="max-width:100%;height:auto;background:white" src="' + esc(f.url) + '" alt="' + esc(f.alt || '원문 도형') + '"><figcaption class="note">원문 도형 · 위키문헌</figcaption></figure>').join('') + '</div>' : '')
    + '</div></div>' + footer();
  const bd = document.getElementById('body-' + w.id), txt = textFor(w);
  if (txt.trim()) bd.textContent = txt;
  else { bd.classList.add('empty-body'); bd.textContent = loadError ? '전문 데이터를 불러오지 못했습니다.' : (pending[w.id]?.reason || '본문 미수록'); }
  window.scrollTo(0, 0);
}

function route() {
  const h = location.hash.slice(1);
  const w = WORKS.find(x => x.id === h);
  if (w) renderDetail(w); else renderList();
}
window.addEventListener('hashchange', route);
route();
})();
</script>

</body>
</html>
