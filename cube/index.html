<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>李箱의 상자</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;600;700&family=Nanum+Myeongjo:wght@700;800&display=swap">
<style>
/* Layout: 화면 전체가 하나의 도면. 3D 캔버스 위에 도면 주기(注記)처럼 HUD를 얹는다. 오른쪽 가장자리의 숫자 띠가 축척 내비게이션. */
:root{
  --blue:#1B3CE0;
  --white:#FFFFFF;
  --f-serif:"Nanum Myeongjo","Batang","AppleMyungjo",serif;
  --f-sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--white);color:var(--blue);font-family:var(--f-sans);overflow:hidden;margin:0}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
.hud{position:fixed;z-index:2;pointer-events:none}
.hud *{pointer-events:auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.brand{top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px))}
.brand h1{margin:0;font-family:var(--f-serif);font-weight:800;font-size:40px;line-height:1;letter-spacing:2px}
.brand p{margin:8px 0 0;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em}

.proj{top:calc(16px + env(safe-area-inset-top,0px));right:calc(max(16px,env(safe-area-inset-right,0px)) + 96px);display:flex;border:1.5px solid var(--blue);background:var(--white)}
.proj button{min-height:44px;min-width:56px;padding:0 12px;font-family:var(--f-serif);font-weight:700;font-size:15px;border-right:1.5px solid var(--blue)}
.proj button:last-child{border-right:0}
.proj button[aria-pressed="true"]{background:var(--blue);color:var(--white)}

.band{top:0;bottom:0;right:max(0px,env(safe-area-inset-right,0px));width:80px;display:flex;flex-direction:column;border-left:1.5px solid var(--blue);background:var(--white);padding-top:env(safe-area-inset-top,0px)}
.band button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-bottom:1.5px solid var(--blue);font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.band button:last-child{border-bottom:0}
.band button b{font-family:var(--f-serif);font-weight:800;font-size:22px}
.band button[aria-current="step"]{background:var(--blue);color:var(--white)}
.band .tick{font-size:10px;letter-spacing:.08em;writing-mode:vertical-rl}

.info{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:min(440px,calc(100vw - 128px));display:flex;flex-direction:column;gap:10px}
.scale{display:flex;align-items:baseline;gap:14px}
.scale .num{font-family:var(--f-mono);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;padding:2px 8px;background:var(--blue);color:var(--white)}
.scale .name{font-family:var(--f-serif);font-weight:800;font-size:64px;line-height:1}
.caption{margin:0;font-size:15px;line-height:1.65;font-weight:600;background:var(--white);padding:2px 0}
.addr{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;border:1.5px solid var(--blue);background:var(--white);padding:8px 12px;display:flex;gap:12px;flex-wrap:wrap}
.addr span:first-child{font-weight:600}
.faces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1.5px solid var(--blue);background:var(--white)}
.faces button{min-height:48px;padding:6px 8px;text-align:left;border-right:1.5px solid var(--blue);border-bottom:1.5px solid var(--blue);display:flex;flex-direction:column;gap:2px}
.faces button:nth-child(3n){border-right:0}
.faces button:nth-child(n+4){border-bottom:0}
.faces button b{font-family:var(--f-serif);font-weight:800;font-size:15px}
.faces button small{font-family:var(--f-mono);font-size:10px}
.faces button[aria-pressed="true"]{background:var(--blue);color:var(--white)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--f-mono);font-size:11px;background:var(--white);padding:4px 0}
.legend i{display:inline-block;width:12px;height:12px;border:1.5px solid var(--blue);vertical-align:-2px;margin-right:6px}
.legend i.solid{background:var(--blue)}
.legend i.hatch{background:repeating-linear-gradient(45deg,var(--blue) 0 1.5px,var(--white) 1.5px 5px)}
.legend i.dash{border-style:dashed}

.nav{left:50%;transform:translateX(calc(-50% - 40px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;border:1.5px solid var(--blue);background:var(--white)}
.nav button{min-height:44px;padding:0 16px;font-weight:700;font-size:14px}
.nav button+button{border-left:1.5px solid var(--blue)}
.nav button:disabled{opacity:.35;cursor:default}

.hint{top:calc(84px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));font-family:var(--f-mono);font-size:11px;line-height:1.7}

.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--white);z-index:5;font-family:var(--f-serif);font-weight:800;font-size:28px;letter-spacing:4px}

@media (max-width:760px){
  .brand h1{font-size:30px}
  .band{top:auto;left:0;right:0;bottom:0;width:auto;height:64px;flex-direction:row;border-left:0;border-top:1.5px solid var(--blue);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);height:calc(64px + env(safe-area-inset-bottom,0px))}
  .band button{border-bottom:0;border-right:1.5px solid var(--blue);gap:2px}
  .band button:last-child{border-right:0}
  .band button b{font-size:17px}
  .band .tick{display:none}
  .proj{right:max(16px,env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px))}
  .proj button{min-width:44px;padding:0 8px;font-size:14px}
  .info{bottom:calc(80px + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 32px)}
  .scale .name{font-size:44px}
  .caption{font-size:13px}
  .nav{display:none}
  .hint{display:none}
}
@media (max-width:760px) and (max-height:760px){ .caption{display:none} }
</style>

<canvas id="stage" aria-label="이상의 원고지 큐브 3D 도면. 드래그하면 90도씩 돌아갑니다."></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const BLUE = '#1B3CE0', WHITE = '#FFFFFF';
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 원문 ---------- */
/* 원문 자리: 이 배열에 작품 원문을 한 줄씩 넣으세요 (당시 표기·띄어쓰기 그대로).
   비워두면 원고지 칸이 □로 채워집니다. */
const LINES = [
  '□□□□□□□□□□□□□□□□□□□□□□□□□□□□□□□□□□□□□□□□'
];
const ORIG = [...LINES.join('')];
const MOD = [...LINES.join('')];
const FACE_TEXT = {
  front: { chars: ORIG, fill: 'void' },
  back: { chars: MOD, fill: 'void' },
  left: { chars: [...'朝鮮中央日報一九三四年七月二十四日學藝面烏瞰圖詩第一號[紙面이미지자리]'], fill: 'halftone' },
  right: { chars: [...'讀者抗議로連載를中斷함豫定三十篇中十五篇發表[記錄蒐集中]'], fill: 'void' },
  top: { chars: [...'一九三四年九人會加入烏瞰圖連載朴泰遠小說家仇甫氏의一日揷畵河戎'], fill: 'void' },
  bottom: { chars: [...'→詩第二號1934詩02→鳥瞰圖1931詩02→거울1933詩03'], fill: 'void' }
};
const CELLS = 20, PER = CELLS * CELLS;
const SHEETS = Math.ceil(ORIG.length / PER);
const TARGET = 0;
const pad2 = n => String(n).padStart(2, '0');
const cellAddr = i => pad2(Math.floor(i / CELLS) + 1) + '-' + pad2(i % CELLS + 1);

/* ---------- three ---------- */
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.setClearColor(0xffffff, 1);
const scene = new THREE.Scene();
const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 6000);
const persp = new THREE.PerspectiveCamera(32, 1, 0.1, 6000);
let cam = ortho;
const cBlue = new THREE.Color(BLUE);
const lineMat = new THREE.LineBasicMaterial({ color: cBlue });
const lineMatW = new THREE.LineBasicMaterial({ color: 0xffffff });
const dashMat = new THREE.LineDashedMaterial({ color: cBlue, dashSize: 0.18, gapSize: 0.14 });

/* textures */
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
function hatchTex(gap, rx, ry) {
  const t = canvasTex(64, 64, (g, w, h) => {
    g.fillStyle = WHITE; g.fillRect(0, 0, w, h);
    g.strokeStyle = BLUE; g.lineWidth = 2.2;
    for (let k = -h; k < w + h; k += gap) { g.beginPath(); g.moveTo(k, 0); g.lineTo(k + h, h); g.stroke(); }
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx || 1, ry || 1);
  return t;
}
const mWhite = new THREE.MeshBasicMaterial({ color: 0xffffff });
const mBlue = new THREE.MeshBasicMaterial({ color: cBlue });
const mDense = new THREE.MeshBasicMaterial({ map: hatchTex(8) });
const mSparse = new THREE.MeshBasicMaterial({ map: hatchTex(16) });
const mVoid = new THREE.MeshBasicMaterial({ map: hatchTex(10) });

const glyphCache = {};
function glyphMat(ch, inv) {
  const key = ch + (inv ? '#i' : '');
  if (glyphCache[key]) return glyphCache[key];
  const t = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = inv ? BLUE : WHITE; g.fillRect(0, 0, w, h);
    g.strokeStyle = inv ? WHITE : BLUE; g.lineWidth = 6; g.strokeRect(3, 3, w - 6, h - 6);
    g.fillStyle = inv ? WHITE : BLUE;
    g.font = '800 196px "Nanum Myeongjo", "Batang", serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(ch, w / 2, h / 2 + 10);
  });
  const m = new THREE.MeshBasicMaterial({ map: t });
  return (glyphCache[key] = m);
}
/* box material order: +x, -x, +y, -y, +z, -z */
function glyphMats(ch, inv) {
  return inv ? [mBlue, mBlue, mBlue, mBlue, glyphMat(ch, true), mBlue]
             : [mDense, mDense, mWhite, mWhite, glyphMat(ch, false), mWhite];
}
function sheetTex(chars, fill) {
  return canvasTex(2048, 2048, (g, w) => {
    const s = w / CELLS;
    g.fillStyle = WHITE; g.fillRect(0, 0, w, w);
    g.font = '800 76px "Nanum Myeongjo", "Batang", serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    for (let i = 0; i < PER; i++) {
      const x = (i % CELLS) * s, y = Math.floor(i / CELLS) * s, ch = chars[i];
      g.strokeStyle = BLUE; g.lineWidth = 3; g.strokeRect(x + 5, y + 5, s - 10, s - 10);
      if (ch) { g.fillStyle = BLUE; g.fillText(ch, x + s / 2, y + s / 2 + 5); }
      else if (fill === 'halftone') {
        const r = 8 + 28 * (0.5 + 0.5 * Math.sin(i * 0.37) * Math.cos(i * 0.11));
        g.fillStyle = BLUE; g.beginPath(); g.arc(x + s / 2, y + s / 2, r, 0, Math.PI * 2); g.fill();
      } else {
        g.save(); g.beginPath(); g.rect(x + 5, y + 5, s - 10, s - 10); g.clip();
        g.strokeStyle = BLUE; g.lineWidth = 3;
        for (let k = -s; k < s * 2; k += 18) { g.beginPath(); g.moveTo(x + k, y); g.lineTo(x + k + s, y + s); g.stroke(); }
        g.restore();
      }
    }
    g.strokeStyle = BLUE; g.lineWidth = 16; g.strokeRect(8, 8, w - 16, w - 16);
  });
}

/* shared geometry */
const boxG = new THREE.BoxGeometry(0.9, 0.9, 0.9);
const boxE = new THREE.EdgesGeometry(boxG);
const tileG = new THREE.BoxGeometry(0.9, 0.9, 0.16);
const tileE = new THREE.EdgesGeometry(tileG);
function edged(geo, edges, mats, lm) {
  const m = new THREE.Mesh(geo, mats);
  m.add(new THREE.LineSegments(edges, lm || lineMat));
  return m;
}

/* ---------- G0 : 1:1 字 ---------- */
const G0 = new THREE.Group(); scene.add(G0);
let bigCube;

/* ---------- G1 : 1:10 面 ---------- */
const G1 = new THREE.Group(); scene.add(G1);
const sheetCells = [];

/* ---------- G2 : 1:100 室 ---------- */
const S = 20;
const G2 = new THREE.Group(); scene.add(G2);
const spin = new THREE.Group(); spin.position.set(0, 0, -S / 2); G2.add(spin);
const net = new THREE.Group(); net.position.set(0, 0, S / 2); spin.add(net);
const piv = {};

/* ---------- G3 : 1:1000 層 ---------- */
const G3 = new THREE.Group(); scene.add(G3);
const floorRooms = [];

/* ---------- G4 : 1:10000 建物 ---------- */
const G4 = new THREE.Group(); scene.add(G4);
const L = 30;
const floorsG = [];
let hakoPlane;

const WINGS = ['詩','小','隨','書','畫','記','寫','評','證'];

function panel(face) {
  const ft = FACE_TEXT[face];
  const side = new THREE.MeshBasicMaterial({ map: hatchTex(8, S, 1) });
  const mats = [side, side, side, side, new THREE.MeshBasicMaterial({ map: sheetTex(ft.chars, ft.fill) }), mWhite];
  const g = new THREE.BoxGeometry(S, S, 1);
  const m = new THREE.Mesh(g, mats);
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g), lineMat));
  return m;
}

function build() {
  /* G0 */
  bigCube = edged(boxG, boxE, glyphMats(ORIG[TARGET], false));
  bigCube.scale.setScalar(1 / 0.9);
  G0.add(bigCube);

  /* G1 */
  for (let i = 0; i < PER; i++) {
    const r = Math.floor(i / CELLS), c = i % CELLS, ch = ORIG[i];
    const m = ch ? edged(boxG, boxE, glyphMats(ch, i === TARGET)) : edged(boxG, boxE, [mDense, mDense, mWhite, mWhite, mVoid, mWhite]);
    if (i === TARGET) m.children[0].material = lineMatW;
    m.position.set(c - (CELLS - 1) / 2, (CELLS - 1) / 2 - r, 0);
    m.userData = { i, ch: ch || '' };
    sheetCells.push(m); G1.add(m);
  }

  /* G2: 십자 전개도 */
  const front = panel('front'); front.position.set(0, 0, -0.5); net.add(front);
  piv.top = new THREE.Group(); piv.top.position.set(0, S / 2, 0); net.add(piv.top);
  const pt = panel('top'); pt.position.set(0, S / 2, -0.5); piv.top.add(pt);
  piv.bottom = new THREE.Group(); piv.bottom.position.set(0, -S / 2, 0); net.add(piv.bottom);
  const pb = panel('bottom'); pb.position.set(0, -S / 2, -0.5); piv.bottom.add(pb);
  piv.back = new THREE.Group(); piv.back.position.set(0, -S, 0); piv.bottom.add(piv.back);
  const pk = panel('back'); pk.position.set(0, -S / 2, -0.5); piv.back.add(pk);
  piv.left = new THREE.Group(); piv.left.position.set(-S / 2, 0, 0); net.add(piv.left);
  const pl = panel('left'); pl.position.set(-S / 2, 0, -0.5); piv.left.add(pl);
  piv.right = new THREE.Group(); piv.right.position.set(S / 2, 0, 0); net.add(piv.right);
  const pr = panel('right'); pr.position.set(S / 2, 0, -0.5); piv.right.add(pr);

  /* G3: 1934層 — 詩棟에 烏瞰圖 30室 (15 施工 + 15 未施工), 나머지 棟은 空 */
  const sp = 1.6, nW = WINGS.length, nR = 30;
  const plateTex = canvasTex(512, 1600, (g, w, h) => {
    g.fillStyle = WHITE; g.fillRect(0, 0, w, h);
    g.strokeStyle = BLUE; g.lineWidth = 3; g.strokeRect(2, 2, w - 4, h - 4);
    g.lineWidth = 1;
    for (let a = 1; a < nW; a++) { const x = a * w / nW; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
    for (let b = 1; b < nR; b++) { const y = b * h / nR; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
  });
  const roomG = new THREE.BoxGeometry(1, 1, 1), roomE = new THREE.EdgesGeometry(roomG);
  for (let w = 0; w < nW; w++) {
    for (let n = 0; n < nR; n++) {
      const x = (w - (nW - 1) / 2) * sp, z = (n - (nR - 1) / 2) * sp;
      let m;
      if (w === 0 && n < 15) {
        const cur = n === 0;
        m = new THREE.Mesh(roomG, cur ? mBlue : [mDense, mDense, mWhite, mWhite, mSparse, mWhite]);
        m.add(new THREE.LineSegments(roomE, cur ? lineMatW : lineMat));
        m.userData = { code: '1934-詩-' + pad2(n + 1), note: '烏瞰圖 詩第' + (n + 1) + '號 · 施工' };
      } else if (w === 0) {
        m = new THREE.LineSegments(roomE, dashMat); m.computeLineDistances();
        m.userData = { code: '1934-詩-' + pad2(n + 1), note: '烏瞰圖 詩第' + (n + 1) + '號 · 未施工' };
      } else {
        continue;
      }
      if (m.type !== 'Mesh' || w === 0) m.position.y = 0;
      m.position.x = x; m.position.z = z;
      if (w !== 0) m.position.y = -0.44;
      m.userData.order = w === 0 ? n : 30 + w;
      floorRooms.push(m); G3.add(m);
    }
  }
  /* 棟 표지 큐브: 각 棟 앞에 한 글자 큐브 */
  WINGS.forEach((wch, w) => {
    const m = edged(boxG, boxE, glyphMats(wch, false));
    m.position.set((w - (nW - 1) / 2) * sp, 0, ((nR - 1) / 2 + 1.6) * sp);
    G3.add(m);
  });

  /* G4: 建物 — 層 = 연도, 棟 = 종류, 號 = 순번 */
  const FL = ['B1', '1929', '1930', '1931', '1932', '1933', '1934', '1935', '1936', '1937'];
  const DATA = { '1929': { 4: 1 }, '1930': { 1: 1 }, '1931': { 0: 3 }, '1932': { 0: 1, 1: 1 }, '1933': { 0: 3 },
    '1934': { 0: 15 }, '1935': { 0: 1, 2: 1 }, '1936': { 0: 1, 1: 3, 2: 1 }, '1937': { 1: 2, 2: 1 } };
  const fx = w => -L / 2 + (w + 0.5) * L / nW, fz = n => -L / 2 + (n + 0.5) * L / nR, fy = f => -L / 2 + f * L / FL.length;
  const rG = new THREE.BoxGeometry(0.8, 0.8, 0.8), rE = new THREE.EdgesGeometry(rG);
  FL.forEach((yr, f) => {
    const grp = new THREE.Group(); grp.userData.f = f;
    const pts = [new THREE.Vector3(-L / 2, fy(f), -L / 2), new THREE.Vector3(L / 2, fy(f), -L / 2), new THREE.Vector3(L / 2, fy(f), L / 2), new THREE.Vector3(-L / 2, fy(f), L / 2), new THREE.Vector3(-L / 2, fy(f), -L / 2)];
    const d = DATA[yr] || {};
    Object.keys(d).forEach(wk => {
      const w = +wk;
      for (let n = 0; n < d[wk]; n++) {
        const cur = yr === '1934' && w === 0 && n === 0;
        const m = new THREE.Mesh(rG, cur ? mBlue : [mDense, mDense, mWhite, mWhite, mSparse, mWhite]);
        m.add(new THREE.LineSegments(rE, cur ? lineMatW : lineMat));
        m.position.set(fx(w), fy(f) + 0.4, fz(n));
        m.userData = { code: yr + '-' + WINGS[w] + '-' + pad2(n + 1), note: cur ? '烏瞰圖 · 現在室' : '施工' };
        grp.add(m);
      }
      if (yr === '1934' && w === 0) {
        for (let n = 15; n < 30; n++) {
          const m = new THREE.LineSegments(rE, dashMat); m.computeLineDistances();
          m.position.set(fx(0), fy(f) + 0.4, fz(n));
          m.userData = { code: '1934-詩-' + pad2(n + 1), note: '未施工' };
          grp.add(m);
        }
      }
    });
    floorsG.push(grp); G4.add(grp);
  });
  const frame = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(L, L, L)), lineMat);
  G4.add(frame);
  const hakoTex = canvasTex(1024, 1024, (g, w, h) => {
    g.clearRect(0, 0, w, h);
    g.strokeStyle = BLUE; g.lineWidth = 6; g.strokeRect(40, 40, w - 80, h - 80);
    g.lineWidth = 2; g.strokeRect(64, 64, w - 128, h - 128);
    g.font = '800 700px "Nanum Myeongjo", "Batang", serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineWidth = 5; g.strokeText('箱', w / 2, h / 2 + 30);
  });
  hakoPlane = new THREE.Mesh(new THREE.PlaneGeometry(L, L), new THREE.MeshBasicMaterial({ map: hakoTex, transparent: true, depthWrite: false }));
  hakoPlane.position.z = L / 2 + 0.05;
  hakoPlane.userData = { code: '李箱', note: '' };
}

/* ---------- camera ---------- */
const DIRS = {
  axo: new THREE.Vector3(0.55, 0.5, 1.2).normalize(),
  persp: new THREE.Vector3(0.9, 0.7, 1.4).normalize(),
  plan: new THREE.Vector3(0, 1, 0),
  elev: new THREE.Vector3(0, 0, 1)
};
let proj = 'axo';
const view = { cx: 0, cy: 0, cz: 0, fit: 3 };
function placeCamera() {
  const w = window.innerWidth, h = window.innerHeight, a = w / h;
  const narrow = w < 760;
  const fit = view.fit * (narrow ? 1.25 : 1);
  const C = new THREE.Vector3(view.cx, view.cy, view.cz);
  const D = DIRS[proj];
  if (proj === 'persp') {
    cam = persp; persp.aspect = a;
    const dist = (fit / 2) / Math.tan(THREE.MathUtils.degToRad(persp.fov / 2)) * (a < 1 ? 1 / a : 1);
    persp.position.copy(C).addScaledVector(D, dist);
    persp.near = Math.max(0.1, dist / 50); persp.far = dist * 50;
  } else {
    cam = ortho;
    let hh = fit / 2, ww = hh * a; if (a < 1) { ww = fit / 2; hh = ww / a; }
    ortho.left = -ww; ortho.right = ww; ortho.top = hh; ortho.bottom = -hh;
    ortho.position.copy(C).addScaledVector(D, 2000);
  }
  cam.up.set(0, 1, 0);
  if (proj === 'plan') cam.up.set(0, 0, -1);
  cam.lookAt(C);
  cam.updateProjectionMatrix();
}

/* ---------- stepped tweens (12fps, 끊기는 움직임) ---------- */
let TOKEN = 0;
function step(dur, steps, fn, done) {
  const tok = TOKEN, t0 = performance.now();
  if (reduceMotion) { fn(1); if (done) done(); return; }
  (function f(now) {
    if (tok !== TOKEN) return;
    const p = Math.min(1, (now - t0) / dur);
    const q = p >= 1 ? 1 : Math.floor(p * steps) / steps;
    fn(q);
    if (p < 1) requestAnimationFrame(f); else if (done) done();
  })(t0);
}
function wait(ms, fn) { const tok = TOKEN; setTimeout(() => { if (tok === TOKEN) fn(); }, reduceMotion ? 0 : ms); }
function tweenView(to, dur, steps, done) {
  const from = Object.assign({}, view);
  step(dur, steps, q => { for (const k in to) view[k] = from[k] + (to[k] - from[k]) * q; placeCamera(); }, done);
}

/* ---------- stages ---------- */
const STAGES = [
  { num: '1:1', name: '字', cap: '글자하나가큐브하나요. 원고지한칸이곧방한칸의벽돌이오.' },
  { num: '1:10', name: '面', cap: '띄어쓰기가없으니원고지가빈틈없이차오. 四百字가한장이오. 빈칸은빗금으로남겨두오.' },
  { num: '1:100', name: '室', cap: '원고지여섯장을접으면방하나가되오. 면마다다른자료가붙소.' },
  { num: '1:1000', name: '層', cap: '一九三四層 詩棟. 烏瞰圖 十五室은施工되고 十五室은끝내짓지못하였소.' },
  { num: '1:10000', name: '建物', cap: '모든층을쌓으면상자하나요. 李箱의箱은상자요. 箱을누르면다시一字로들어가오.' }
];
let stage = -1;
const $ = id => document.getElementById(id);
function setAddr(a, b) { canvas.title = a + (b ? ' · ' + b : ''); }
function defaultAddr(n) {
  const base = '1934-詩-01';
  if (n === 0) return setAddr(base + ' / 正 / ' + cellAddr(TARGET), '「' + ORIG[TARGET] + '」 · 第' + (TARGET + 1) + '字');
  if (n === 1) return setAddr(base + ' / 正', ORIG.length + '字 / 四百字 · ' + SHEETS + '枚');
  if (n === 2) return setAddr(base, '烏瞰圖 詩第一號 · 六面');
  if (n === 3) return setAddr('1934', '詩棟 30室 · 施工 15 · 未施工 15');
  return setAddr('李箱', '10層 · 9棟 · 1929—1937');
}
function showOnly(g) { [G0, G1, G2, G3, G4].forEach(x => { x.visible = x === g; }); }
const rotY = [0, 0, 0, 0, 0];
function groupOf(n) { return n === 2 ? spin : [G0, G1, G2, G3, G4][n]; }

function setFold(q) {
  piv.left.rotation.y = -Math.PI / 2 * q; piv.right.rotation.y = Math.PI / 2 * q;
  piv.top.rotation.x = -Math.PI / 2 * q; piv.bottom.rotation.x = Math.PI / 2 * q;
  piv.back.rotation.x = Math.PI / 2 * q;
}

function enter(n) {
  if (n === stage) return;
  TOKEN++;
  const prevStage = stage; stage = n;
  defaultAddr(n);
  faceIdx = 0;

  if (n === 0) {
    showOnly(G0);
    Object.assign(view, { cx: 0, cy: 0, cz: 0, fit: prevStage === 4 ? 0.2 : view.fit });
    tweenView({ fit: 3.4 }, 520, 6);
  }
  if (n === 1) {
    showOnly(G1);
    const tr = Math.floor(TARGET / CELLS), tc = TARGET % CELLS;
    const ring = m => Math.max(Math.abs(Math.floor(m.userData.i / CELLS) - tr), Math.abs(m.userData.i % CELLS - tc));
    sheetCells.forEach(m => { m.visible = ring(m) === 0; });
    const tx = tc - (CELLS - 1) / 2, ty = (CELLS - 1) / 2 - tr;
    if (prevStage === 0 || prevStage === -1) Object.assign(view, { cx: tx, cy: ty, cz: 0, fit: 3.4 });
    step(700, 8, q => { const R = q * CELLS; sheetCells.forEach(m => { m.visible = ring(m) <= R; }); });
    tweenView({ cx: 0, cy: (CELLS - 1) / 2 - 4.5, cz: 0, fit: 11 }, 700, 8);
  }
  if (n === 2) {
    showOnly(G2);
    spin.rotation.set(0, rotY[2], 0);
    setFaceButtons('front');
    if (prevStage === 1) {
      setFold(0);
      tweenView({ cx: 0, cy: -S / 2, cz: 0, fit: 92 }, 420, 4, () => {
        wait(260, () => {
          step(900, 6, q => setFold(q), () => tweenView({ cx: 0, cy: S / 2 - 6, cz: 0, fit: 13 }, 420, 4));
        });
      });
    } else {
      setFold(1);
      Object.assign(view, { cx: 0, cy: S / 2 - 6, cz: 0, fit: 13 });
      placeCamera();
    }
  }
  if (n === 3) {
    showOnly(G3);
    floorRooms.forEach(m => { m.visible = m.userData.order === 0; });
    Object.assign(view, { cx: 0, cy: 0, cz: 0, fit: prevStage === 2 ? 6 : view.fit });
    tweenView({ cx: 0, cy: 0, cz: 0, fit: 46 }, 520, 6);
    step(1100, 10, q => { const lim = q * 40; floorRooms.forEach(m => { m.visible = m.userData.order <= lim; }); });
  }
  if (n === 4) {
    showOnly(G4);
    hakoPlane.visible = false;
    floorsG.forEach(g => { g.visible = g.userData.f === 6; });
    Object.assign(view, { cx: 0, cy: 0, cz: 0, fit: prevStage === 3 ? 34 : view.fit });
    tweenView({ fit: 66 }, 520, 6);
    step(1000, 10, q => { const lim = Math.round(q * 6); floorsG.forEach(g => { g.visible = Math.abs(g.userData.f - 6) <= lim; }); });
  }
  if (n !== 2) groupOf(n).rotation.y = rotY[n];
}

/* 6면 보기 */
const FACE_ROT = { front: [0, 0], back: [0, Math.PI], left: [0, Math.PI / 2], right: [0, -Math.PI / 2], top: [Math.PI / 2, 0], bottom: [-Math.PI / 2, 0] };
const FACE_NOTE = { front: ['正', '原文 · ' + ORIG.length + '字'], back: ['背', '現代語'], left: ['左', '誌面 · 朝鮮中央日報 1934.7.24'],
  right: ['右', '記錄 · 連載中斷'], top: ['天井', '年譜 · 1934'], bottom: ['床', '廊下 · 連結된 3室'] };
function setFaceButtons() {}
const FACE_ORDER = ['front', 'right', 'back', 'left', 'top', 'bottom'];
let faceIdx = 0;
function showFace(f) {
  if (stage !== 2) return;
  TOKEN++;
  setFold(1);
  setFaceButtons(f);
  setAddr('1934-詩-01 / ' + FACE_NOTE[f][0], FACE_NOTE[f][1]);
  const fx = spin.rotation.x, fy = spin.rotation.y, tx = FACE_ROT[f][0], ty = FACE_ROT[f][1];
  step(380, 4, q => { spin.rotation.x = fx + (tx - fx) * q; spin.rotation.y = fy + (ty - fy) * q; });
  tweenView({ cx: 0, cy: S / 2 - 6, cz: 0, fit: 13 }, 380, 4);
}

/* 90° 스냅 회전 */
function rotateStage(dir) {
  const g = groupOf(stage); const from = g.rotation.y, to = from + dir * Math.PI / 2;
  rotY[stage] = to;
  step(320, 4, q => { g.rotation.y = from + (to - from) * q; });
}

/* ---------- input ---------- */
let down = null, rotated = false;
canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, x0: e.clientX, py: e.clientY }; rotated = false; canvas.setPointerCapture(e.pointerId); });
/* 面·室 단계: 위아래로 끌면 원고지를 따라 읽어 내려가고, 좌우로 끌면 90°씩 돌아간다 */
const PAN = { 1: [-(CELLS - 1) / 2 + 3, (CELLS - 1) / 2 - 3], 2: [-S / 2 + 6, S / 2 - 6] };
canvas.addEventListener('pointermove', e => {
  if (down) {
    const dx = e.clientX - down.x;
    const dyStep = e.clientY - down.py;
    if (PAN[stage] && Math.abs(e.clientY - down.y) > Math.abs(e.clientX - down.x0) && Math.abs(e.clientY - down.y) > 6) {
      const perPx = (cam === ortho ? (ortho.top - ortho.bottom) : view.fit) / window.innerHeight;
      const lim = PAN[stage];
      view.cy = Math.max(lim[0], Math.min(lim[1], view.cy + dyStep * perPx));
      down.py = e.clientY; rotated = true; placeCamera();
      return;
    }
    down.py = e.clientY;
    if (Math.abs(dx) > 70) { rotateStage(dx > 0 ? 1 : -1); down.x = e.clientX; rotated = true; }
    return;
  }
  hover(e);
});
canvas.addEventListener('pointerup', e => {
  if (down && !rotated) {
    const dy = e.clientY - down.y, dx = e.clientX - down.x0;
    if (Math.abs(dy) < 8 && Math.abs(dx) < 8) pick(e);
    else if (e.pointerType !== 'mouse' && Math.abs(dy) > 60) go(dy < 0 ? 1 : -1);
  }
  down = null;
});
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function hitAt(e) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, cam);
  let pool = [];
  if (stage === 1) pool = sheetCells.filter(m => m.visible);
  if (stage === 3) pool = floorRooms.filter(m => m.visible && m.type === 'Mesh');
  if (stage === 4) { floorsG.forEach(g => { if (g.visible) g.children.forEach(c => { if (c.type === 'Mesh') pool.push(c); }); }); if (hakoPlane.visible) pool.push(hakoPlane); }
  const hits = ray.intersectObjects(pool, false);
  return hits.length ? hits[0].object : null;
}
let lastHover = null;
function hover(e) {
  if (stage !== 1 && stage !== 3 && stage !== 4) return;
  const o = hitAt(e);
  if (o === lastHover) return; lastHover = o;
  if (!o) { defaultAddr(stage); canvas.style.cursor = ''; return; }
  canvas.style.cursor = 'pointer';
  if (stage === 1) {
    const u = o.userData;
    setAddr('1934-詩-01 / 正 / ' + cellAddr(u.i), u.ch ? '「' + u.ch + '」 · 第' + (u.i + 1) + '字' : '空 · 빈칸');
  } else setAddr(o.userData.code, o.userData.note);
}
function pick(e) {
  if (stage === 4) { enter(0); return; }
  if (stage === 3) { const o = hitAt(e); if (o && o.userData.code === '1934-詩-01') enter(2); return; }
  if (stage === 2) { faceIdx = (faceIdx + 1) % FACE_ORDER.length; showFace(FACE_ORDER[faceIdx]); return; }
  go(1);
}
const PROJS = ['axo', 'persp', 'plan', 'elev'];
let wheelLock = 0;
window.addEventListener('wheel', e => {
  const now = performance.now();
  if (now < wheelLock || Math.abs(e.deltaY) < 8) return;
  wheelLock = now + 950;
  go(e.deltaY > 0 ? 1 : -1);
}, { passive: true });
window.addEventListener('keydown', e => {
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); go(1); }
  if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); go(-1); }
  if (e.key === 'ArrowLeft') rotateStage(-1);
  if (e.key === 'ArrowRight') rotateStage(1);
});
function go(d) {
  if (d > 0) enter(stage === 4 ? 0 : stage + 1);
  else if (stage > 0) enter(stage - 1);
}
window.addEventListener('keydown', e => { if (e.key === 'p' || e.key === 'P') { proj = PROJS[(PROJS.indexOf(proj) + 1) % PROJS.length]; placeCamera(); } });

function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  placeCamera();
}
window.addEventListener('resize', resize);
function loop() { renderer.render(scene, cam); requestAnimationFrame(loop); }

/* ---------- boot: 서체가 들어온 뒤 글자를 굽는다 ---------- */
const allText = Array.from(new Set(ORIG.concat(MOD, ...Object.values(FACE_TEXT).map(f => f.chars), [...'詩小隨書畫記寫評證箱']))).join('');
const fontWait = (document.fonts && document.fonts.load)
  ? Promise.race([
      Promise.all([document.fonts.load('800 80px "Nanum Myeongjo"', allText), document.fonts.load('600 12px "IBM Plex Mono"')]),
      new Promise(r => setTimeout(r, 3500))
    ]).catch(() => {})
  : Promise.resolve();
fontWait.then(() => {
  build();
  resize();
  enter(0);
  loop();
  const ld = $('loading'); if (ld) ld.remove();
});
})();
</script>
